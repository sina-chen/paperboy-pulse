name: Update Dashboard

on:
  schedule:
    - cron: '27 8 * * *'  # Every day at 8:27am UTC (10:27am German time)
  workflow_dispatch:       # Allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to commit DB + deploy to Pages

    steps:
      - name: Checkout paperboy-pulse
        uses: actions/checkout@v4

      - name: Fetch latest status.csv from paperboy
        run: |
          curl -sSL \
            "https://raw.githubusercontent.com/JBGruber/paperboy/main/inst/status.csv" \
            -o data/status_raw.csv
          python3 -c "
with open('data/status_raw.csv', 'r', encoding='utf-8') as f:
    content = f.read()
lines = content.replace('\r\n', '\n').replace('\r', '\n').split('\n')
cleaned = []
for line in lines:
    if line.startswith('\"') and line.endswith('\"'):
        line = line[1:-1]
    cleaned.append(line)
result = '\n'.join(cleaned).replace('\"\"', '\"')
with open('data/status.csv', 'w', encoding='utf-8') as f:
    f.write(result)
"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2

      - name: Run scraper checks
        run: Rscript monitors/run_checks.R

      - name: Commit updated database
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/paperboy_monitor.sqlite data/status.csv
          git diff --staged --quiet || git commit -m "chore: update monitor results [skip ci]"
          git push

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render dashboard
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: dashboard/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dashboard/_site
